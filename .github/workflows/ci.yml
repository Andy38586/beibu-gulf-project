name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # d067 (P1): 依赖安全扫描。独立 job，high+ 漏洞阻断构建。（原 8.2 d060，重编号消除与主清单 d060-typeSettings 冲突）
  # 使用官方 npm registry（npmmirror 镜像无 audit 端点，d042 教训）。
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          registry-url: https://registry.npmjs.org

      - name: Install root dependencies
        run: npm ci

      - name: npm audit (root, high+ 阻断)
        run: npm audit --audit-level=high

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: npm audit (backend, high+ 阻断)
        run: npm audit --audit-level=high

  lint-and-build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # engines 要求 node >= 22.18.0，CI 版本必须与之对齐
        node-version: [22.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check format
        run: npm run format:check

      - name: Run lint
        run: npm run lint

      - name: Architecture contract (dependency-cruiser)
        run: npm run cruise

      - name: Type check
        run: npm run typecheck

      # d053: secret-scan 入 CI —— gitleaks 扫当前工作树(非 git 历史,避免历史遗留 key 导致 CI 常红;
      # 历史清理走 tools/git-clean-history.sh,属一次性人工操作)。
      - name: Secret scan (gitleaks)
        run: |
          OS=$(uname -s | tr '[:upper:]' '[:lower:]')
          ARCH=$(uname -m)
          case "$ARCH" in x86_64|amd64) ARCH="x64";; aarch64|arm64) ARCH="arm64";; esac
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/latest/download/gitleaks_${OS}_${ARCH}.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz
          ./gitleaks detect --redact --source . --no-banner

      # d053 补充: .env 类文件禁止入库(仅允许 .env.example)
      - name: Ensure .env files are not tracked
        run: |
          if git ls-files | grep -E '(^|/)\.env(\.|$)' | grep -v '\.env\.example'; then
            echo "::error::.env 文件被 git 跟踪,敏感配置禁止提交"
            exit 1
          fi

      - name: Run frontend tests
        run: npm test -- --coverage

      - name: Build project
        run: npm run build

  backend-tests:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: backend/package.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run backend tests
        working-directory: backend
        run: npm test -- --coverage

  # d066 (D-9=A): 构建镜像并推送 GHCR，触发服务器 webhook 部署。
  # 仅 main 分支、且前端+后端+审计全部通过后执行。
  deploy:
    needs: [lint-and-build, backend-tests, audit]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest

      - name: Trigger server deploy webhook
        if: ${{ secrets.DEPLOY_WEBHOOK_URL != '' }}
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.DEPLOY_WEBHOOK_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"image\":\"ghcr.io/${{ github.repository }}:${{ github.sha }}\"}" \
            "${{ secrets.DEPLOY_WEBHOOK_URL }}"
