name: CI

# 特性分支 push 即跑全部校验门禁（audit / lint-and-build / nest-tests / algorithm-tests），
# 让「能否合入 main」在分支阶段就可见，不再攒到合入主线才第一次跑 CI、连环报错。
# deploy job 自带 if: github.ref == 'refs/heads/main'，非 main 分支只校验、绝不部署，安全。
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # d067 (P1): 依赖安全扫描。独立 job，high+ 漏洞阻断构建。
  # 使用官方 npm registry（npmmirror 镜像无 audit 端点，d042 教训）。
  # 2026-08-09：通过 package.json overrides 修复全部 8 个漏洞
  # （brace-expansion/dompurify/glob/nanoid/postcss/protobufjs/shell-quote/undici），
  # 移除 continue-on-error，恢复为硬性阻断。
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          registry-url: https://registry.npmjs.org

      - name: Install root dependencies
        run: npm ci

      - name: npm audit (root, high+ 阻断)
        run: npm audit --audit-level=high

      - name: Install Nest dependencies (audit)
        working-directory: backend
        run: npm ci

      - name: npm audit (nest, high+ 阻断)
        working-directory: backend
        run: npm audit --audit-level=high

  lint-and-build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # engines 要求 node >= 22.18.0，CI 版本必须与之对齐
        node-version: [22.x]

    steps:
      - name: Checkout code
        # fix/refactor 测试门禁需比对 HEAD~1：checkout 默认浅克隆（depth=1）下 HEAD~1 不存在，
        # git diff fatal + bash -e 会误杀本步骤（114 翻车根因），此处拉全量历史
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # v3 迁移期：Nest 是独立 workspace（backend），typecheck 与测试需独立依赖，
      # 与根/backend 依赖分开安装，对齐 ci:local 的分段语义
      - name: Install Nest dependencies
        working-directory: backend
        run: npm ci

      # v3 三道防线（no-ephemeral / structure / routes-audit）：纯静态分析不依赖安装，
      # 放格式化之前让违规尽早红（对齐 ci:local 首段 guard:v3）
      - name: Run v3 guard
        run: npm run guard:v3

      - name: Check format
        # 2026-08-09：全仓 prettier 格式化完成，恢复硬性阻断
        run: npm run format:check

      - name: Run lint
        run: npm run lint

      # z101：样式硬编码无 CI 拦截 → stylelint 接入（存量已清零，硬性阻断新增）
      - name: Run stylelint
        run: npm run stylelint

      - name: Architecture contract (dependency-cruiser)
        run: npm run cruise

      # 0909-G02：API 契约校验入 CI —— gen-api-contract --check 校验 schemas 全量
      # 类型导出与测试覆盖（README「契约在 CI 校验」承诺兑现）
      - name: API contract check
        run: npm run types:check

      - name: Type check
        run: npm run typecheck

      # v3 迁移期：Nest 类型门禁（tsc --noEmit）——nest build 对类型错误 exit 0，
      # 只有 tsc --noEmit 是真门禁（pre-push 已同款，CI 兜底服务器防线）
      - name: Type check (Nest)
        run: npm run typecheck --prefix backend

      # d053: secret-scan 入 CI —— gitleaks 扫当前工作树(非 git 历史,避免历史遗留 key 导致 CI 常红;
      # 历史清理走 tools/git-clean-history.sh,属一次性人工操作)。
      # 2026-08-29：补 --no-git（此前命令缺它实际扫全量 git 历史——浅克隆下只扫到 HEAD 故未爆，
      # fetch-depth:0 后 405 个提交里的 3 处历史 key 立刻命中，与注释设计意图一致化）。
      # 2026-08-09 修复：/releases/latest/download 资产名带版本号（gitleaks_8.24.3_linux_x64.tar.gz），
      # 原模板 gitleaks_${OS}_${ARCH}.tar.gz 无版本号 → 404。改固定版本下载。
      - name: Secret scan (gitleaks)
        run: |
          OS=$(uname -s | tr '[:upper:]' '[:lower:]')
          ARCH=$(uname -m)
          case "$ARCH" in x86_64|amd64) ARCH="x64";; aarch64|arm64) ARCH="arm64";; esac
          GITLEAKS_VERSION=8.24.3
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_${OS}_${ARCH}.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz
          ./gitleaks detect --config gitleaks.toml --redact --source . --no-banner --no-git

      # d053 补充: .env 类文件禁止入库(仅允许 .env.example)
      - name: Ensure .env files are not tracked
        run: |
          if git ls-files | grep -E '(^|/)\.env(\.|$)' | grep -v '\.env\.example'; then
            echo "::error::.env 文件被 git 跟踪,敏感配置禁止提交"
            exit 1
          fi

      - name: Run frontend tests
        run: npm test -- --coverage

      # tools/ 下的脚本单测（导入/质检/迁移）：此前游离于所有测试链路之外，
      # `npm test` 只跑 frontend，写在这里的用例实际从未被执行（门禁清单存在 ≠ 被执行）。
      # 覆盖率阈值不适用（工具脚本不入前端/后端阈值体系），故只跑断言。
      - name: Run tools tests
        run: npm run test:tools

      # 816-专项5并-4-4：fix:/refactor: 提交若改动 src 实现必须附测试（03 §1.6 提交约定）。
      # 仅对 push 事件检查最近一次提交；PR 分支语义不适用（开发分支多为 squash）。
      - name: fix/refactor must include tests
        if: github.event_name == 'push'
        run: |
          last_msg="$(git log -1 --format=%s)"
          if echo "$last_msg" | grep -qE '^(fix|refactor)(\(|:)'; then
            changed="$(git diff --name-only HEAD~1 HEAD)"
            src_changed="$(echo "$changed" | grep -E '^(frontend/src|backend)/.*\.(ts|vue|js|mjs|cjs)$' | grep -vE '\.(test|spec)\.' || true)"
            test_changed="$(echo "$changed" | grep -E '\.(test|spec)\.(ts|js|vue)$' || true)"
            if [ -n "$src_changed" ] && [ -z "$test_changed" ]; then
              echo "::error::fix/refactor 提交改动 src 实现但未附测试（03 §1.6）："
              echo "$src_changed"
              exit 1
            fi
          fi

      - name: Build project
        # 天地图 key 由 GitHub Secrets 注入（构建期打包进前端产物）。
        # 缺失时 vite 用 .env 占位符构建 → 生产镜像底图 404（与本地 dev 行为不一致）。
        # 配置：Settings → Secrets and variables → Actions → New secret: TIANDITU_KEY
        run: npm run build
        env:
          VITE_TIANDITU_KEY: ${{ secrets.TIANDITU_KEY }}

  # v3 业务层（NestJS，Express 退役后主 API）；依赖独立 workspace，随 job 落地
  nest-tests:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: backend/package.json

      - name: Install Nest dependencies
        working-directory: backend
        run: npm ci

      - name: Run Nest tests
        # 真库 e2e 套件在无 PG 的 CI 环境经 V3_INTEGRATION_DB 门控整体跳过
        #（见 nest/test 下真库 spec 的 describe.skipIf）；需要库的联调/部署回归
        # 在本地起 postgis 后 export V3_INTEGRATION_DB=1 全量跑
        working-directory: backend
        run: npm test -- --coverage

  # T5.1 起：算法服务（FastAPI，flood 兼容区 + route 新区）纳入 CI——此前 pytest
  # 只在本机 venv 跑，游离于门禁链路；HTTP/离线用例全量跑，真演算用例依赖 DEM 文件
  #（gitignored，CI 无卷自动 skip；本地带 DEM 手动全量）
  algorithm-service-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: backend/algorithm-service
        run: |
          pip install --no-cache-dir -r requirements.txt pytest
          python --version

      - name: Run pytest (HTTP + 离线计算套件)
        working-directory: backend/algorithm-service
        # test_real_engine 的真演算用例在无 DEM 的 CI 自动 skip（conftest 检测卷缺失），
        # 剩余 HTTP/route/topology/graph 全量离线可跑；失败必须红（不 continue-on-error）
        run: python -m pytest tests/ -q

  # 镜像构建推送（2026-09-10 起替代服务器端构建）：服务器 1.6G 内存扛不住 docker 内
  # vite/nest/pip 构建（峰值 3-5G，OOM 卡死系统→SSH exit 255/Workbench 连接超时，
  # run#134/135/136 实证）——镜像统一在 CI 构建推 GHCR，部署只 pull。
  # IMAGE_TAG 与 deploy 同源：${{ github.run_number }}（正整数，易回滚）
  build-push-images:
    needs: [lint-and-build, algorithm-service-tests]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    env:
      IMAGE_TAG: ${{ github.run_number }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 三服务镜像：在一个 job 内逐次构建推送（共享 buildx 缓存，减少重复拉基础层）
      - name: Build and push app (vite 前端 + nginx)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/andy38586/beibu-gulf-project-app:${{ env.IMAGE_TAG }}
            ghcr.io/andy38586/beibu-gulf-project-app:latest
          build-args: |
            VITE_TIANDITU_KEY=${{ secrets.TIANDITU_KEY }}
            VITE_DATA_SOURCE=fetch
            VITE_USE_NEST_MODULES=auth,plans,favorites,forecast,flood,site-analysis

      - name: Build and push nest
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile.nest
          push: true
          tags: |
            ghcr.io/andy38586/beibu-gulf-project-nest:${{ env.IMAGE_TAG }}
            ghcr.io/andy38586/beibu-gulf-project-nest:latest

      - name: Build and push algorithm-service
        uses: docker/build-push-action@v6
        with:
          context: ./backend/algorithm-service
          file: ./backend/algorithm-service/Dockerfile
          push: true
          tags: |
            ghcr.io/andy38586/beibu-gulf-project-algorithm-service:${{ env.IMAGE_TAG }}
            ghcr.io/andy38586/beibu-gulf-project-algorithm-service:latest

      # GHCR 新包默认 private，服务器 docker pull（匿名）拉不了——用带 GITHUB_TOKEN 的
      # API 把三个包设为 public（部署服务器无 GHCR 凭证，公开只读拉取）
      - name: Make packages public (服务器匿名 pull)
        run: |
          for pkg in app nest algorithm-service; do
            curl -sS -X PUT \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              -d '{"visibility":"public"}' \
              "https://api.github.com/user/packages/container/beibu-gulf-project-${pkg}/visibility" \
              || echo "warn: 包 beibu-gulf-project-${pkg} public 化失败（若已 public 可忽略）"
          done

  # 2026-08-09：部署改为 SSH 直部署（原 GHCR+webhook 方案废弃——服务器端无需额外
  # webhook 服务，Actions 用仓库 Secrets 里的服务器私钥直连）。
  # 前置配置：
  #   - Secrets: SERVER_SSH_KEY（服务器私钥全文）、SERVER_HOST（服务器 IP）、
  #     SERVER_USER（root 或 ubuntu）、TIANDITU_KEY（天地图新 key，构建注入）
  #   - 服务器：/opt/beibu-gulf 下 clone 仓库 + .env 配置 VITE_TIANDITU_KEY/JWT_SECRET
  #   - 服务器公钥已加入 GitHub 账户（git pull 免密）
  deploy:
    needs: [lint-and-build, nest-tests, algorithm-service-tests, audit, build-push-images]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}

      - name: Deploy via SSH (pull + compose up)
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          # d117：22 端口受跨境 SSH 干扰（TCP 通、banner 丢失，#121/#122 复现），
          # 服务器 sshd 增听高位端口并经此 Secret 切换；未配置时回退 22 行为不变
          SSH_PORT: ${{ secrets.SERVER_SSH_PORT || 22 }}
          # 与 build-push-images job 同源：run_number（正整数），服务器拉同 tag 镜像
          IMAGE_TAG: ${{ github.run_number }}
        run: |
          # 短命令快速通道：连接层失败（exit 255）自动重试 3 次；远端命令自身失败
          # （非 255）直接透传退出码，重试无意义
          ssh_quick() {
            local attempt_exit=0
            for attempt in 1 2 3; do
              attempt_exit=0
              ssh -o StrictHostKeyChecking=no -o ConnectTimeout=15 -p "$SSH_PORT" \
                "$SERVER_USER@$SERVER_HOST" "$1" || attempt_exit=$?
              [ "$attempt_exit" -eq 0 ] && return 0
              [ "$attempt_exit" -ne 255 ] && return "$attempt_exit"
              echo "::warning::SSH 连接失败（exit 255，疑似链路/负载问题），第 ${attempt}/3 次，10 秒后重试" >&2
              [ "$attempt" -lt 3 ] && sleep 10
            done
            return 1
          }
          # 阶段一（短会话）：同步代码。users.json 由跟踪转为 gitignore 后与服务器运行时
          # 副本冲突，ff-only pull 拒绝删除被修改文件——先备份真实数据到仓库外、还原
          # HEAD 版本让删除动作执行，pull 后放回（此后 untracked 受忽略保护，幂等）。
          # 顺带清理此前失败轮次残留的本地构建进程（docker compose up --build 卡死
          # 会持续占内存拖垮 sshd——run#135/136 卡死现场；容器由 containerd 托管，pkill 不误伤）
          if ! ssh_quick "cd /opt/beibu-gulf \
            && mkdir -p /opt/beibu-gulf-runtime-data \
            && cp -f backend/data/users.json /opt/beibu-gulf-runtime-data/ 2>/dev/null; \
            git checkout -- backend/data/users.json 2>/dev/null; \
            git pull --ff-only || exit 1; \
            cp -f /opt/beibu-gulf-runtime-data/users.json backend/data/users.json 2>/dev/null; \
            pkill -9 -f 'docker compose' 2>/dev/null; pkill -9 -f 'docker build' 2>/dev/null; \
            docker info >/dev/null 2>&1 || systemctl restart docker; true"; then
            echo "::error::git pull 阶段失败（服务器仓库状态或链路异常）"
            exit 1
          fi
          # 阶段二（短会话）：触发后台「拉镜像 + 启动」即返回。镜像由 CI 构建推送
          # GHCR（build-push-images job），服务器只 pull 不 build——内存峰值从 3-5G
          # 降到解包级（1G 内），OOM 卡死根除；pull/up 仍可能跨 G 分钟，故继续
          # nohup 脱离会话 + 状态文件，避免长连接被强断。收尾清未用镜像（40G 磁盘）
          if ! ssh_quick "cd /opt/beibu-gulf; rm -f /tmp/beibu-deploy-status; \
            nohup bash -c 'IMAGE_TAG=${IMAGE_TAG} docker compose pull > /tmp/beibu-deploy.log 2>&1 \
              && IMAGE_TAG=${IMAGE_TAG} docker compose up -d >> /tmp/beibu-deploy.log 2>&1 \
              && echo OK > /tmp/beibu-deploy-status || echo FAIL > /tmp/beibu-deploy-status; \
              docker image prune -f >> /tmp/beibu-deploy.log 2>&1' >/dev/null 2>&1 & \
            echo pull-triggered"; then
            echo "::error::触发部署失败"
            exit 1
          fi
          # 阶段三（短会话轮询）：每 30s 查一次状态文件；轮询自身的 SSH 抖动只跳过本轮
          for i in $(seq 1 60); do
            sleep 30
            status="$(ssh_quick "cat /tmp/beibu-deploy-status 2>/dev/null || echo RUNNING" 2>/dev/null)" || continue
            case "$status" in
              OK)
                echo "部署完成（耗时约 $((i * 30))s，tag=${IMAGE_TAG}）"
                exit 0
                ;;
              FAIL)
                echo "::error::服务器端 pull/启动失败，日志尾部："
                ssh_quick "tail -n 60 /tmp/beibu-deploy.log" || true
                exit 1
                ;;
            esac
            echo "拉取/启动进行中（${i}/60）..."
          done
          echo "::error::部署 30 分钟未完成（GHCR 跨境拉取慢或服务器异常），登录服务器查 /tmp/beibu-deploy.log"
          exit 1
