name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # d067 (P1): 依赖安全扫描。独立 job，high+ 漏洞阻断构建。
  # 使用官方 npm registry（npmmirror 镜像无 audit 端点，d042 教训）。
  # 2026-08-09：通过 package.json overrides 修复全部 8 个漏洞
  # （brace-expansion/dompurify/glob/nanoid/postcss/protobufjs/shell-quote/undici），
  # 移除 continue-on-error，恢复为硬性阻断。
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          registry-url: https://registry.npmjs.org

      - name: Install root dependencies
        run: npm ci

      - name: npm audit (root, high+ 阻断)
        run: npm audit --audit-level=high

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: npm audit (backend, high+ 阻断)
        run: npm audit --audit-level=high

  lint-and-build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # engines 要求 node >= 22.18.0，CI 版本必须与之对齐
        node-version: [22.x]

    steps:
      - name: Checkout code
        # fix/refactor 测试门禁需比对 HEAD~1：checkout 默认浅克隆（depth=1）下 HEAD~1 不存在，
        # git diff fatal + bash -e 会误杀本步骤（114 翻车根因），此处拉全量历史
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check format
        # 2026-08-09：全仓 prettier 格式化完成，恢复硬性阻断
        run: npm run format:check

      - name: Run lint
        run: npm run lint

      # z101：样式硬编码无 CI 拦截 → stylelint 接入（存量已清零，硬性阻断新增）
      - name: Run stylelint
        run: npm run stylelint

      - name: Architecture contract (dependency-cruiser)
        run: npm run cruise

      - name: Type check
        run: npm run typecheck

      # d053: secret-scan 入 CI —— gitleaks 扫当前工作树(非 git 历史,避免历史遗留 key 导致 CI 常红;
      # 历史清理走 tools/git-clean-history.sh,属一次性人工操作)。
      # 2026-08-09 修复：/releases/latest/download 资产名带版本号（gitleaks_8.24.3_linux_x64.tar.gz），
      # 原模板 gitleaks_${OS}_${ARCH}.tar.gz 无版本号 → 404。改固定版本下载。
      - name: Secret scan (gitleaks)
        run: |
          OS=$(uname -s | tr '[:upper:]' '[:lower:]')
          ARCH=$(uname -m)
          case "$ARCH" in x86_64|amd64) ARCH="x64";; aarch64|arm64) ARCH="arm64";; esac
          GITLEAKS_VERSION=8.24.3
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_${OS}_${ARCH}.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz
          ./gitleaks detect --config gitleaks.toml --redact --source . --no-banner

      # d053 补充: .env 类文件禁止入库(仅允许 .env.example)
      - name: Ensure .env files are not tracked
        run: |
          if git ls-files | grep -E '(^|/)\.env(\.|$)' | grep -v '\.env\.example'; then
            echo "::error::.env 文件被 git 跟踪,敏感配置禁止提交"
            exit 1
          fi

      - name: Run frontend tests
        run: npm test -- --coverage

      # 816-专项5并-4-4：fix:/refactor: 提交若改动 src 实现必须附测试（03 §1.6 提交约定）。
      # 仅对 push 事件检查最近一次提交；PR 分支语义不适用（开发分支多为 squash）。
      - name: fix/refactor must include tests
        if: github.event_name == 'push'
        run: |
          last_msg="$(git log -1 --format=%s)"
          if echo "$last_msg" | grep -qE '^(fix|refactor)(\(|:)'; then
            changed="$(git diff --name-only HEAD~1 HEAD)"
            src_changed="$(echo "$changed" | grep -E '^(frontend/src|backend)/.*\.(ts|vue|js|mjs|cjs)$' | grep -vE '\.(test|spec)\.' || true)"
            test_changed="$(echo "$changed" | grep -E '\.(test|spec)\.(ts|js|vue)$' || true)"
            if [ -n "$src_changed" ] && [ -z "$test_changed" ]; then
              echo "::error::fix/refactor 提交改动 src 实现但未附测试（03 §1.6）："
              echo "$src_changed"
              exit 1
            fi
          fi

      - name: Build project
        # 天地图 key 由 GitHub Secrets 注入（构建期打包进前端产物）。
        # 缺失时 vite 用 .env 占位符构建 → 生产镜像底图 404（与本地 dev 行为不一致）。
        # 配置：Settings → Secrets and variables → Actions → New secret: TIANDITU_KEY
        run: npm run build
        env:
          VITE_TIANDITU_KEY: ${{ secrets.TIANDITU_KEY }}

  backend-tests:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: backend/package.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run backend tests
        # 816-M9：backend 补装 @vitest/coverage-v8 后带覆盖率跑——thresholds（50/45/50/50）在 CI 生效，
        # 原 2026-08-09 注释"未装 coverage-v8 秒败"已随依赖补齐失效
        working-directory: backend
        run: npm test -- --coverage

  # 2026-08-09：部署改为 SSH 直部署（原 GHCR+webhook 方案废弃——服务器端无需额外
  # webhook 服务，Actions 用仓库 Secrets 里的服务器私钥直连）。
  # 前置配置：
  #   - Secrets: SERVER_SSH_KEY（服务器私钥全文）、SERVER_HOST（服务器 IP）、
  #     SERVER_USER（root 或 ubuntu）、TIANDITU_KEY（天地图新 key，构建注入）
  #   - 服务器：/opt/beibu-gulf 下 clone 仓库 + .env 配置 VITE_TIANDITU_KEY/JWT_SECRET
  #   - 服务器公钥已加入 GitHub 账户（git pull 免密）
  deploy:
    needs: [lint-and-build, backend-tests, audit]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}

      - name: Deploy via SSH (pull + compose up)
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          # F2：部署注入版本 tag（日期+run 号），镜像不再覆写 latest——
          # rollback.sh 可用历史 tag 回滚（docker images 列出后 ./scripts/rollback.sh <tag>）
          IMAGE_TAG="$(date +%Y%m%d)-${GITHUB_RUN_NUMBER}"
          ssh -o StrictHostKeyChecking=no "$SERVER_USER@$SERVER_HOST" \
            "cd /opt/beibu-gulf && git pull --ff-only && IMAGE_TAG='${IMAGE_TAG}' docker compose up --build -d && docker image prune -f"
