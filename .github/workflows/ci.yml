name: CI

# 特性分支 push 即跑全部校验门禁（audit / static-checks / frontend-tests / backend-tests），
# 让「能否合入 main」在分支阶段就可见，不再攒到合入主线才第一次跑 CI、连环报错。
# deploy job 自带 if: github.ref == 'refs/heads/main'，非 main 分支只校验、绝不部署，安全。
# 2026-09-12（CI 审查 C2）：移除 pull_request 触发 —— push 已覆盖全分支（branches: ['**']），
# PR 事件会对同一 commit 以 refs/pull/N/merge 再跑一轮全量流水线，且两组 concurrency
# group（refs/heads/x vs refs/pull/N/merge）互不取消 = 同提交双跑（省近一半 CI 时长）。
# 副作用：fork 仓库的 PR 不再触发本流水线（单人项目、分支直推，可接受）。
on:
  push:
    branches: ['**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── C6（P1）路径过滤（保守默认）─────────────────────────────────────────────
  # 以 push 前后提交的变更清单决定两个测试 job 去留：
  #   仅 docs/**、*.md、性能测评-* 变更 → 只跑 static-checks（文档改动不需要测试兜底）；
  #   仅 backend/** 变更 → 跳过 frontend-tests；
  #   仅 frontend/** 变更 → 跳过 backend-tests；
  #   混合变更 / 根配置、tools、scripts、.github 等未知路径 → 全量跑（宁慢勿漏）。
  # ⚠️ main 分支部署链路不受过滤影响：build-push-images / deploy 照常执行
  #   （漏测比慢更糟的边界在测试侧，不在部署侧——部署拉的是 run_number 新 tag）。
  changes:
    runs-on: ubuntu-latest
    outputs:
      run-frontend: ${{ steps.filter.outputs.run-frontend }}
      run-backend: ${{ steps.filter.outputs.run-backend }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed paths（对比 push 前一提交）
        id: filter
        run: |
          BASE="${{ github.event.before }}"
          # 新分支首推（before=0000...）或本地无该对象时回退 HEAD~1；仓库首提交则全量跑
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            if git rev-parse -q --verify HEAD~1 >/dev/null 2>&1; then BASE=HEAD~1; else BASE=HEAD; fi
          fi
          changed="$(git diff --name-only "$BASE" "${GITHUB_SHA}" || true)"
          echo "changed paths vs ${BASE}:"
          echo "$changed" | head -50
          has_backend=0
          has_frontend=0
          has_other=0
          if [ -z "$changed" ]; then
            echo "diff 为空（首提交/回退路径），保守全量跑"
            has_other=1
          else
            while IFS= read -r p; do
              [ -z "$p" ] && continue
              case "$p" in
                docs/*|*.md|性能测评-*) ;;                      # 文档类：不触发测试
                backend/*) has_backend=1 ;;
                frontend/*) has_frontend=1 ;;
                *) has_other=1; break ;;                        # 未知路径：全量
              esac
            done <<< "$changed"
          fi
          if [ "$has_other" -eq 1 ]; then
            run_frontend=true; run_backend=true
          else
            [ "$has_frontend" -eq 1 ] && run_frontend=true || run_frontend=false
            [ "$has_backend" -eq 1 ] && run_backend=true || run_backend=false
          fi
          echo "run-frontend=$run_frontend"
          echo "run-backend=$run_backend"
          echo "run-frontend=$run_frontend" >> "$GITHUB_OUTPUT"
          echo "run-backend=$run_backend" >> "$GITHUB_OUTPUT"

  # d067 (P1): 依赖安全扫描。独立 job，high+ 漏洞阻断构建。
  # 使用官方 npm registry（npmmirror 镜像无 audit 端点，d042 教训）。
  # 2026-08-09：通过 package.json overrides 修复全部 8 个漏洞
  # （brace-expansion/dompurify/glob/nanoid/postcss/protobufjs/shell-quote/undici），
  # 移除 continue-on-error，恢复为硬性阻断。
  audit:
    runs-on: ubuntu-latest
    needs: [changes]
    # C6：docs-only 变更连依赖清单都不可能改，audit 一并跳过（对齐"只跑 static-checks"口径）
    if: needs.changes.outputs.run-frontend == 'true' || needs.changes.outputs.run-backend == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          registry-url: https://registry.npmjs.org
          # 2026-09-12（CI 审查 C8）：audit 此前是唯一无 npm 缓存的 job，双份 npm ci 全价
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: npm audit (root, high+ 阻断)
        run: npm audit --audit-level=high

      - name: Install Nest dependencies (audit)
        working-directory: backend
        run: npm ci

      - name: npm audit (nest, high+ 阻断)
        working-directory: backend
        run: npm audit --audit-level=high

  # ── C1（P0）拆巨石 job 之一：静态检查 ──────────────────────────────────────
  # 原 lint-and-build 12 步串行"全有全无"（format 3 秒与 vite build 8 分钟同 job），
  # 任何一步失败都要等前面全部跑完。拆分后本 job 纯静态 3-5 分钟出全量快检结果，
  # 与测试 job 并行，失败反馈回路缩短 4-5 倍。
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        # engines 要求 node >= 22.18.0，CI 版本必须与之对齐
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # v3 迁移期：Nest 是独立 workspace（backend），typecheck 需独立依赖，
      # 与根依赖分开安装，对齐 ci:local 的分段语义
      - name: Install Nest dependencies
        working-directory: backend
        run: npm ci

      # v3 三道防线（no-ephemeral / structure / routes-audit）：纯静态分析不依赖安装，
      # 放格式化之前让违规尽早红（对齐 ci:local 首段 guard:v3）
      - name: Run v3 guard
        run: npm run guard:v3

      - name: Check format
        # 2026-08-09：全仓 prettier 格式化完成，恢复硬性阻断
        run: npm run format:check

      - name: Run lint
        run: npm run lint

      # z101：样式硬编码无 CI 拦截 → stylelint 接入（存量已清零，硬性阻断新增）
      - name: Run stylelint
        run: npm run stylelint

      - name: Architecture contract (dependency-cruiser)
        run: npm run cruise

      # 0909-G02：API 契约校验入 CI —— gen-api-contract --check 校验 schemas 全量
      # 类型导出与测试覆盖（README「契约在 CI 校验」承诺兑现）
      - name: API contract check
        run: npm run types:check

      - name: Type check
        run: npm run typecheck

      # v3 迁移期：Nest 类型门禁（tsc --noEmit）——nest build 对类型错误 exit 0，
      # 只有 tsc --noEmit 是真门禁（pre-push 已同款，CI 兜底服务器防线）
      - name: Type check (Nest)
        run: npm run typecheck --prefix backend

      # d053: secret-scan 入 CI —— gitleaks 扫当前工作树(非 git 历史,避免历史遗留 key 导致 CI 常红;
      # 历史清理走 tools/git-clean-history.sh,属一次性人工操作)。
      # 2026-08-29：补 --no-git（此前命令缺它实际扫全量 git 历史——浅克隆下只扫到 HEAD 故未爆，
      # fetch-depth:0 后 405 个提交里的 3 处历史 key 立刻命中，与注释设计意图一致化）。
      # 2026-08-09 修复：/releases/latest/download 资产名带版本号（gitleaks_8.24.3_linux_x64.tar.gz），
      # 原模板 gitleaks_${OS}_${ARCH}.tar.gz 无版本号 → 404。改固定版本下载。
      - name: Secret scan (gitleaks)
        run: |
          OS=$(uname -s | tr '[:upper:]' '[:lower:]')
          ARCH=$(uname -m)
          case "$ARCH" in x86_64|amd64) ARCH="x64";; aarch64|arm64) ARCH="arm64";; esac
          GITLEAKS_VERSION=8.24.3
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_${OS}_${ARCH}.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz
          ./gitleaks detect --config gitleaks.toml --redact --source . --no-banner --no-git

      # d053 补充: .env 类文件禁止入库(仅允许 .env.example)
      - name: Ensure .env files are not tracked
        run: |
          if git ls-files | grep -E '(^|/)\.env(\.|$)' | grep -v '\.env\.example'; then
            echo "::error::.env 文件被 git 跟踪,敏感配置禁止提交"
            exit 1
          fi

  # ── C1（P0）拆巨石 job 之二：前端测试 ─────────────────────────────────────
  frontend-tests:
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.run-frontend == 'true'
    steps:
      - name: Checkout code
        # fix/refactor 测试门禁需比对 HEAD~1：checkout 默认浅克隆（depth=1）下 HEAD~1 不存在，
        # git diff fatal + bash -e 会误杀本步骤（114 翻车根因），此处拉全量历史
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # tools 测试（gis-import/db-import 等）经相对路径依赖 backend 的 node_modules
      # （如 verify.mjs require('pg')）——C1 拆 job 后本 job 不再天然持有 backend 依赖，
      # 不补装则 Run tools tests 报 MODULE_NOT_FOUND（run 34682249425 实锤）
      - name: Install Nest dependencies
        working-directory: backend
        run: npm ci

      # 2026-09-12（C5）：覆盖率门禁由 vitest 固定阈值改为基线棘轮
      #（scripts/coverage-ratchet.cjs + frontend/coverage-baseline.json，容差 0.5pt）——
      # 根除"大版本分母暴涨 → 总体百分比下滑 → 第一次 CI 必红"的机制性追尾
      - name: Run frontend tests (coverage + ratchet)
        run: |
          npm test -- --coverage
          node scripts/coverage-ratchet.cjs frontend/coverage/coverage-summary.json frontend/coverage-baseline.json

      # tools/ 下的脚本单测（导入/质检/迁移）：此前游离于所有测试链路之外，
      # `npm test` 只跑 frontend，写在这里的用例实际从未被执行（门禁清单存在 ≠ 被执行）。
      # 覆盖率棘轮不适用（工具脚本不入前端/后端基线体系），故只跑断言。
      - name: Run tools tests
        run: npm run test:tools

      # 816-专项5并-4-4：fix:/refactor: 提交若改动 src 实现必须附测试（03 §1.6 提交约定）。
      # 仅对 push 事件检查最近一次提交（push 全分支触发后 PR squash 语义不再适用）。
      - name: fix/refactor must include tests
        if: github.event_name == 'push'
        run: |
          last_msg="$(git log -1 --format=%s)"
          if echo "$last_msg" | grep -qE '^(fix|refactor)(\(|:)'; then
            changed="$(git diff --name-only HEAD~1 HEAD)"
            src_changed="$(echo "$changed" | grep -E '^(frontend/src|backend)/.*\.(ts|vue|js|mjs|cjs)$' | grep -vE '\.(test|spec)\.' || true)"
            test_changed="$(echo "$changed" | grep -E '\.(test|spec)\.(ts|js|vue)$' || true)"
            if [ -n "$src_changed" ] && [ -z "$test_changed" ]; then
              echo "::error::fix/refactor 提交改动 src 实现但未附测试（03 §1.6）："
              echo "$src_changed"
              exit 1
            fi
          fi

  # ── C1（P0）拆巨石 job 之三：后端测试 ── C4（P0）：真库门控套件激活 ────────
  # 2026-09-12（C4）：挂 PostGIS+pgRouting service container，export V3_INTEGRATION_DB=1，
  # 12 个此前在 CI 恒跳过的真库套件（repository 层 + 6 个 e2e 全链路）从"沉睡"变"站岗"
  #（2026-09-10 pid 符号 / 2026-09-11 SRID 两类事故正源于该盲区）。
  # 镜像用 pgrouting/pgrouting：postgis/postgis:16-3.4 无 pgRouting 扩展，
  # route 域 pgr_withPoints 无法执行（本地 probe 实证）。库口径对齐 docker-compose.v3.yml。
  # seed（backend/test/seed/ci-seed.sh）幂等：schema + 仓库内真数据（flood_levels 251 档 /
  # 设施 83 / 港口 3）+ roads_noded 最小夹具；POI/xiaoqu 源数据不在仓库 → 数据绑定 spec 自探测跳过。
  backend-tests:
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.run-backend == 'true'
    services:
      postgis:
        image: pgrouting/pgrouting:16-3.5-3.8
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: v3_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d v3_dev"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'
          cache-dependency-path: backend/package.json

      - name: Install Nest dependencies
        working-directory: backend
        run: npm ci

      - name: Ensure psql client
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi

      - name: Seed v3_dev（schema + 真数据 + roads_noded 夹具，幂等）
        run: bash backend/test/seed/ci-seed.sh

      - name: Run Nest tests（真库门控激活 + coverage）
        working-directory: backend
        env:
          V3_INTEGRATION_DB: '1'
        run: npm test -- --coverage

      # C5：后端基线棘轮（backend/coverage-baseline.json），基线为真库激活后的实测水平
      - name: Coverage ratchet (backend)
        run: node scripts/coverage-ratchet.cjs backend/coverage/coverage-summary.json backend/coverage-baseline.json

  # ⚠️ algorithm-service-tests job 已于 2026-09-10（阶段 4）随 FastAPI 退役移除：
  #    服务下线（compose 不再部署），pytest 套件保留在 backend/algorithm-service/tests
  #    供将来恢复时使用（本地 venv 手动跑）。
  # ⚠️ 独立 vite build 步骤已随巨石 job 拆分移除（C9）：feature 分支的"可构建性"由
  #    typecheck 把类型关、由 main 的 build-push-images Docker 构建做整体验证，
  #    feature 分支每次 push 省 ~8 分钟（vite build 无增量模式，纯重复成本）。

  # 镜像构建推送（2026-09-10 起替代服务器端构建）：服务器 1.6G 内存扛不住 docker 内
  # vite/nest/pip 构建（峰值 3-5G，OOM 卡死系统→SSH exit 255/Workbench 连接超时，
  # run#134/135/136 实证）——镜像统一在 CI 构建推 GHCR，部署只 pull。
  # IMAGE_TAG 与 deploy 同源：${{ github.run_number }}（正整数，易回滚）
  # 2026-09-12：needs 由 [lint-and-build] 改为拆分后三 job——测试被 C6 过滤跳过时
  #（docs-only 等）不阻塞构建部署；测试真红（failure）仍阻断。
  build-push-images:
    needs: [static-checks, frontend-tests, backend-tests]
    runs-on: ubuntu-latest
    if: >-
      always() && !failure() && !cancelled() &&
      github.ref == 'refs/heads/main'
    env:
      IMAGE_TAG: ${{ github.run_number }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # 用 PAT（write:packages）而非 GITHUB_TOKEN：installation token 无权
          # 创建账户下的首个 GHCR 包（run#139/140/141 三连 "Create organization
          # package" 拒绝），PAT 首次创建后 GITHUB_TOKEN 才可续写
          password: ${{ secrets.GHCR_PAT }}

      # 三服务镜像：在一个 job 内逐次构建推送（共享 buildx 缓存，减少重复拉基础层）
      # 2026-09-10：补 GHA 层缓存（cache-from/to: type=gha）。此前无缓存配置→每次
      # 从头构建全部层；实测 build-push 步骤耗时 9 分钟（run#151 08:57:55→09:07:04）。
      # mode=max 缓存全部中间层（对 app 的多阶段 vite 构建收益最大）。
      - name: Build and push app (vite 前端 + nginx)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/andy38586/beibu-gulf-project:app-${{ env.IMAGE_TAG }}
            ghcr.io/andy38586/beibu-gulf-project:app-latest
          build-args: |
            VITE_TIANDITU_KEY=${{ secrets.TIANDITU_KEY }}
            VITE_DATA_SOURCE=fetch
            VITE_USE_NEST_MODULES=auth,plans,favorites,forecast,flood,site-analysis,route
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

      - name: Build and push nest
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile.nest
          push: true
          tags: |
            ghcr.io/andy38586/beibu-gulf-project:nest-${{ env.IMAGE_TAG }}
            ghcr.io/andy38586/beibu-gulf-project:nest-latest
          cache-from: type=gha,scope=nest
          cache-to: type=gha,mode=max,scope=nest

      # 2026-09-10（阶段 4）：algorithm-service 镜像构建步骤已随 FastAPI 退役移除
      # （GHCR 上的历史 tag algorithm-service-* 保留，供将来恢复）

      # GHCR 包默认 private，服务器 docker pull（匿名）拉不了——
      # 用带 GHCR_PAT 的 API 把 beibu-gulf-project 包设为 public（三镜像同包）。
      # 2026-09-12（CI 审查 1.5-4 / C7）：原 `|| echo warn` 把失败吞成警告——首次建包时
      # 若 PAT 权限不足，public 化失败 → 服务器匿名 pull nest 镜像必挂，而 CI 报错指向
      # 部署健康检查阶段，绕远路。改为：先 GET 查可见性（已 public 幂等放行），
      # PUT 失败显式 ::error:: 并中断本 job（deploy 因 needs 链不会执行）。
      - name: Make package public (服务器匿名 pull)
        env:
          GH_TOKEN: ${{ secrets.GHCR_PAT }}
        run: |
          code="$(curl -sS -o /tmp/pkg-vis.json -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/user/packages/container/beibu-gulf-project")" || {
            echo "::error::查询 GHCR 包信息失败（HTTP $code）——PAT 需 read:packages 权限"
            cat /tmp/pkg-vis.json 2>/dev/null || true
            exit 1
          }
          if [ "$code" = "200" ] && grep -Eq '"visibility" *: *"public"' /tmp/pkg-vis.json; then
            echo "包已 public，幂等放行"
            exit 0
          fi
          put_code="$(curl -sS -o /tmp/pkg-put.json -w '%{http_code}' -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -d '{"visibility":"public"}' \
            "https://api.github.com/user/packages/container/beibu-gulf-project/visibility")" || true
          if [ "$put_code" != "204" ]; then
            echo "::error::GHCR 包 public 化失败（HTTP ${put_code}）——服务器匿名 pull 依赖 public 可见性，不放行。首次建包需 PAT 含 write:packages。"
            cat /tmp/pkg-put.json 2>/dev/null || true
            exit 1
          fi
          echo "包已设为 public（HTTP 204）"

  # 2026-08-09：部署改为 SSH 直部署（原 GHCR+webhook 方案废弃——服务器端无需额外
  # webhook 服务，Actions 用仓库 Secrets 里的服务器私钥直连）。
  # 前置配置：
  #   - Secrets: SERVER_SSH_KEY（服务器私钥全文）、SERVER_HOST（服务器 IP）、
  #     SERVER_USER（root 或 ubuntu）、TIANDITU_KEY（天地图新 key，构建注入）
  #   - 服务器：/opt/beibu-gulf 下 clone 仓库 + .env 配置 VITE_TIANDITU_KEY/JWT_SECRET
  #   - 服务器公钥已加入 GitHub 账户（git pull 免密）
  # 2026-09-12：needs 随巨石 job 拆分更新；C6 过滤把测试/audit 跳过（skipped ≠ failure）时
  # 部署照常（"main 部署不受过滤影响"）；audit/测试真红（failure）仍经 !failure() 阻断。
  deploy:
    needs: [audit, build-push-images]
    runs-on: ubuntu-latest
    if: always() && !failure() && !cancelled() && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}

      - name: Deploy via SSH (pull + compose up)
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          # d117：22 端口受跨境 SSH 干扰（TCP 通、banner 丢失，#121/#122 复现），
          # 服务器 sshd 增听高位端口并经此 Secret 切换；未配置时回退 22 行为不变
          SSH_PORT: ${{ secrets.SERVER_SSH_PORT || 22 }}
          # 与 build-push-images job 同源：run_number（正整数），服务器拉同 tag 镜像
          IMAGE_TAG: ${{ github.run_number }}
        run: |
          # 短命令快速通道：连接层失败（exit 255）自动重试 3 次；远端命令自身失败
          # （非 255）直接透传退出码，重试无意义
          ssh_quick() {
            local attempt_exit=0 err_txt=""
            for attempt in 1 2 3; do
              attempt_exit=0
              # 捕获 stderr 到 err_txt（2>&1 先并流再丢弃 stdout，ssh 连接错误与远端 stderr 都会进来），
              # 失败时透传原文到 annotations，不再只报「exit 255」泛化消息（跨境 22 端口 banner 丢失会 255）
              err_txt="$(ssh -o StrictHostKeyChecking=no -o ConnectTimeout=15 -p "$SSH_PORT" \
                "$SERVER_USER@$SERVER_HOST" "$1" 2>&1 >/dev/null)" || attempt_exit=$?
              [ "$attempt_exit" -eq 0 ] && return 0
              if [ "$attempt_exit" -ne 255 ]; then
                echo "::error::远端命令失败(exit ${attempt_exit}) stderr: ${err_txt}"
                return "$attempt_exit"
              fi
              echo "::warning::SSH 连接失败(exit 255) stderr: ${err_txt}（第 ${attempt}/3 次，10 秒后重试）" >&2
              [ "$attempt" -lt 3 ] && sleep 10
            done
            return 1
          }
          # 阶段一（短会话）：同步代码。users.json 由跟踪转为 gitignore 后与服务器运行时
          # 副本冲突，ff-only pull 拒绝删除被修改文件——先备份真实数据到仓库外、还原
          # HEAD 版本让删除动作执行，pull 后放回（此后 untracked 受忽略保护，幂等）。
          # 顺带清理此前失败轮次残留的本地构建进程（docker compose up --build 卡死
          # 会持续占内存拖垮 sshd——run#135/136 卡死现场；容器由 containerd 托管，pkill 不误伤）。
          # 注意 pkill -f 模式用 [d]ocker 写法防自匹配（run#144：命令行含 'docker compose'
          # 字面被自己 pkill 自杀 → SSH 会话被杀 → exit 255 空 stderr）
          if ! ssh_quick "cd /opt/beibu-gulf \
            && cp -f backend/data/users.json /tmp/beibu-users.bak 2>/dev/null; \
            git checkout -- backend/data/users.json 2>/dev/null; \
            git pull --ff-only || exit 1; \
            cp -f /tmp/beibu-users.bak backend/data/users.json 2>/dev/null; \
            pkill -9 -f '[d]ocker compose' 2>/dev/null; pkill -9 -f '[d]ocker build' 2>/dev/null; \
            docker info >/dev/null 2>&1 || sudo systemctl restart docker; true"; then
            echo "::error::git pull 阶段失败（SSH_PORT=${SSH_PORT}；见上方 ssh stderr 原文）"
            exit 1
          fi
          # 阶段二（短会话）：触发后台「拉镜像 + 启动」即返回。镜像由 CI 构建推送
          # GHCR（build-push-images job），服务器只 pull 不 build——内存峰值从 3-5G
          # 降到解包级（1G 内），OOM 卡死根除；pull/up 仍可能跨 G 分钟，故继续
          # nohup 脱离会话 + 状态文件，避免长连接被强断。收尾清未用镜像（40G 磁盘）
          # run#151 实测坑：up 被中断会留下 `<hash>_beibu-postgis` 残壳，下次 up 报
          # 「container name already in use」致整个 up 中止（其它容器也不更新）→
          # 起手先清 created 状态残壳（该状态不运行任何进程，删除无副作用），
          # 并给 up 加 --remove-orphans 处理孤立容器。
          if ! ssh_quick "cd /opt/beibu-gulf; rm -f /tmp/beibu-deploy-status; \
            docker ps -aq --filter status=created | xargs -r docker rm -f >/dev/null 2>&1; \
            nohup bash -c 'IMAGE_TAG=${IMAGE_TAG} docker compose pull > /tmp/beibu-deploy.log 2>&1 \
              && IMAGE_TAG=${IMAGE_TAG} docker compose up -d --remove-orphans >> /tmp/beibu-deploy.log 2>&1 \
              && echo OK > /tmp/beibu-deploy-status || echo FAIL > /tmp/beibu-deploy-status; \
              docker image prune -f >> /tmp/beibu-deploy.log 2>&1' >/dev/null 2>&1 & \
            echo pull-triggered"; then
            echo "::error::触发部署失败"
            exit 1
          fi
          # 阶段三（成功判定，双通道）：①优先公网 HTTP 健康检查（走 80 端口 nginx 反代，
          # 跨境 HTTP 比 SSH 稳定得多）②SSH 读状态文件兜底。run#146 实测服务器 8 分钟
          # 全部启动、状态文件 OK，但 CI 侧跨境 SSH 轮询 25 分钟全部打不通被 continue
          # 跳过 → 从未读到成功的「部署 30 分钟未完成」误红；改 HTTP 判定后此问题根除。
          HTTP_BASE="http://${SERVER_HOST}"
          for i in $(seq 1 90); do
            sleep 20
            # 通道一：公网 HTTP 健康检查（nest ready 即全链健康：postgis→nest→nginx 依赖链）
            if code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "${HTTP_BASE}/nest-api/health/ready" 2>/dev/null)"; then
              if [ "$code" = "200" ]; then
                # ⚠️ run#151 教训：健康检查 200 只证明「服务活着」，**旧容器同样满足**——
                # 当时 deploy 仅 40s 即报 success，而容器仍是 -149（跨境 pull 未完成）。
                # 故追加镜像 tag 校验：容器实际 image 必须已是本次 IMAGE_TAG。
                actual_image="$(ssh_quick "docker inspect beibu-nest --format '{{.Config.Image}}'" 2>/dev/null)" || actual_image=""
                case "$actual_image" in
                  *":nest-${IMAGE_TAG}")
                    echo "部署完成：健康检查 200 且容器镜像已是 nest-${IMAGE_TAG}（耗时约 $((i * 20))s）"
                    exit 0
                    ;;
                  "")
                    # SSH 校验不可用时降级（避免偶发 SSH 抖动导致永久红）：回到「HTTP 200 即成功」
                    echo "部署完成：健康检查 200（镜像校验降级：SSH 未返回，tag=${IMAGE_TAG}，耗时约 $((i * 20))s）"
                    exit 0
                    ;;
                  *)
                    echo "健康检查已 200，但容器镜像仍是 '${actual_image}'（期望 nest-${IMAGE_TAG}）——pull/up 尚未完成，继续等待..."
                    ;;
                esac
              fi
            fi
            # 通道二：SSH 读服务器状态文件（HTTP 不可达时兜底；每次尝试单发，失败跳过本轮）
            status="$(ssh_quick "cat /tmp/beibu-deploy-status 2>/dev/null || echo RUNNING" 2>/dev/null)" || status="RUNNING"
            case "$status" in
              FAIL)
                echo "::error::服务器端 pull/启动失败，日志尾部："
                ssh_quick "tail -n 60 /tmp/beibu-deploy.log" || true
                exit 1
                ;;
            esac
            echo "部署进行中（${i}/90，http=$code ssh=$status）..."
          done
          echo "::error::部署 30 分钟未就绪（HTTP 未 200 且 SSH 未 OK），登录服务器查 /tmp/beibu-deploy.log"
          exit 1
