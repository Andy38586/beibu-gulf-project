# v3 开发栈 —— PostGIS + algorithm-service（NestJS 服务随后加入）
# 用法: docker compose -f docker-compose.v3.yml up -d
# 连接: host=localhost port=5432 user=postgres password=postgres dbname=v3_dev
services:
  postgis:
    image: postgis/postgis:16-3.4
    container_name: beibu-postgis
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: v3_dev
    ports:
      - '5432:5432'
    volumes:
      - beibu-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d v3_dev']
      interval: 5s
      timeout: 3s
      retries: 12

  # 在线演算服务（T5.1 由 flood-service 平移演进）：flood 兼容区 + route 新区。
  # 数据 ro 挂载 backend/data（flood_levels.json.gz 251 档预计算表 / facilityPoints.json /
  # dem）；DEM 缺失时在线演算兜底 503，查表不受影响。生产同源经 nginx 反代。
  algorithm-service:
    build:
      context: ./backend/algorithm-service
    container_name: beibu-algorithm-service
    volumes:
      - ./backend/data:/app/backend/data:ro
    ports:
      - '8000:8000'
    restart: unless-stopped

volumes:
  beibu-pgdata:
