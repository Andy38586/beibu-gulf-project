# v3 开发栈 —— 当前仅 PostGIS（NestJS/FastAPI 服务随后加入）
# 用法: docker compose -f docker-compose.v3.yml up -d
# 连接: host=localhost port=5432 user=postgres password=postgres dbname=v3_dev
services:
  postgis:
    image: postgis/postgis:16-3.4
    container_name: beibu-postgis
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: v3_dev
    ports:
      - '5432:5432'
    volumes:
      - beibu-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d v3_dev']
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  beibu-pgdata:
