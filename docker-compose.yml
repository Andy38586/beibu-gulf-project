# 北部湾港 WebGIS 智慧分析平台 —— 本地/生产一键编排（v3 四服务合并版）
# 用法：docker compose up --build
#   前端：      http://localhost:80（nginx，同域反代）
#   业务 API：  http://localhost:80/nest-api/...（经 nginx 反代 → nest:3000）
#   演算服务：  http://localhost:8000（algorithm-service，容器内）
#   PostGIS：   localhost:5432（v3_dev）
services:
  # 前端 + nginx（唯一对外暴露 80/443；API/DEM/瓦片均同域反代）
  app:
    build:
      context: .
      dockerfile: Dockerfile
      # 2026-08-09：前端构建需要天地图 key（vite build 打包进产物）。
      # 值读自 compose 同目录 .env（服务器部署时在项目目录配置 VITE_TIANDITU_KEY=新key）
      args:
        VITE_TIANDITU_KEY: ${VITE_TIANDITU_KEY:-}
        VITE_DATA_SOURCE: ${VITE_DATA_SOURCE:-fetch}
        # v3 生产默认全量走 Nest：六功能域全部切 nest-api（Express 已退役）
        VITE_USE_NEST_MODULES: ${VITE_USE_NEST_MODULES:-auth,plans,favorites,forecast,flood,site-analysis}
    # 镜像由 CI 构建推送 GHCR（服务器 1.6G 内存扛不住 docker 内构建：vite/nest/pip
    # 峰值 3-5G 会 OOM 卡死系统——部署只 pull 不 build）；build 段保留供本地 dev 用。
    image: ghcr.io/andy38586/beibu-gulf-project:app-${IMAGE_TAG:-app-latest}
    container_name: beibu-gulf-webgis
    # 削峰（2026-09-10，15:30 修订）：四容器共存，为每容器设上限以防单容器失控。
    # 实测 nginx+静态驻留仅 8.4MB，128m → 64m（仍有 7 倍余量）。
    # ⚠️ 关键澄清：mem_limit 是「上限」不是「预留」——调低它**不会**释放物理内存，
    # 也不会「让给」其他容器（空闲配额本来就不占内存）。真正让演算服务可用的是
    # 它自己的上限 640m → 1024m（见 algorithm-service 注释）。
    # 该守的口径：**实际总占用** < 物理 1613m − 宿主机开销（daemon/sshd/系统 ~300m）
    # ≈ 1300m。原注释按「上限之和 < 物理内存」配置，漏算宿主机开销，是 09-10 OOM 成因。
    mem_limit: 64m
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=production
    volumes:
      # 静态真数据：nest 与 algorithm-service 经 ro volume 共享（数据资产不烘焙进镜像）
      - ./backend/data:/app/backend/data
      # DEM 静态产物（tif 67MB 被 gitignore、CI 镜像不含；本地含 → CI/本地镜像不一致）。
      - ./backend/static/dem:/app/backend/static/dem
      - ./backend/static/terrain:/app/backend/static/terrain
      # TLS 证书（可选）：将 fullchain.pem + privkey.pem 放入 ./certs/ 即启用 HTTPS
      - ./certs:/etc/nginx/certs:ro
    ports:
      - '80:80'
      - '443:443'
      - '8443:8443'
    depends_on:
      nest:
        condition: service_healthy
    restart: unless-stopped

  # v3 业务层（NestJS，Express 退役后主 API）——nginx 反代 /nest-api → nest:3000
  nest:
    build:
      context: ./backend
      dockerfile: Dockerfile.nest
    image: ghcr.io/andy38586/beibu-gulf-project:nest-${IMAGE_TAG:-nest-latest}
    container_name: beibu-nest
    # 削峰（15:30 修订）：实测稳态仅 43MB（原注释「~250MB」高估约 6 倍）；320m → 192m。
    # 属防御性收紧防单容器失控，**不释放物理内存**（mem_limit 是上限非预留）。
    mem_limit: 192m
    env_file:
      # JWT_SECRET 等运行时密钥由部署侧 .env 注入，不烘焙进镜像
      #（原仅 app 服务挂 env_file，nest 靠"注释约定"注入 → 容器实际拿不到，启动即 FATAL）
      - ./backend/.env
    environment:
      NODE_ENV: production
      # 端口统一 3000（nginx 反代目标不变）；PG 走 compose 服务名 postgis
      PORT: '3000'
      PG_HOST: postgis
      PG_PORT: '5432'
      PG_USER: postgres
      PG_PASSWORD: postgres
      PG_DB: v3_dev
      DATA_DIR: /app/backend/data
      # JWT_SECRET 由部署 .env 注入（backend/.env），不烘焙进镜像
    volumes:
      - ./backend/data:/app/backend/data:ro
    depends_on:
      postgis:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/nest-api/health/ready || exit 1']
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  # PostGIS（空间数据，v3_dev）
  postgis:
    image: postgis/postgis:16-3.4
    container_name: beibu-postgis
    # 削峰（15:30 修订）：实测稳态仅 95MB（原注释「150-300MB」为估算）；384m → 320m。
    # 属防御性收紧防单容器失控，**不释放物理内存**（mem_limit 是上限非预留）。
    # 限参（shared_buffers/work_mem 小档）保留；max_connections=20 与 nest/算法池式连接匹配
    mem_limit: 320m
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - work_mem=4MB
      - -c
      - max_connections=20
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: v3_dev
    ports:
      - '5432:5432'
    volumes:
      - beibu-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d v3_dev']
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  # 在线演算服务（FastAPI）：flood 兼容区 + route 新区；nginx /flood-online → algorithm-service:8000
  algorithm-service:
    build:
      context: ./backend/algorithm-service
    image: ghcr.io/andy38586/beibu-gulf-project:algorithm-service-${IMAGE_TAG:-algorithm-service-latest}
    container_name: beibu-algorithm-service
    # 削峰（15:30 修订）：原注释「冷启动构图峰值 200-450MB」为估算且严重低估。
    # 09-10 15:24 dmesg 铁证：`constraint=CONSTRAINT_MEMCG` + `Killed process (uvicorn)
    # anon-rss:612396kB` —— 是 cgroup 上限（非整机耗尽）把构图自己掐死，612MB 时仍在上冲。
    # 后果：任何真实演算请求必崩（容器被 restart 拉起，出网表现为 502）。
    # 其他三容器实测占用仅 8.4/43/95MB，大量配额闲置，故重分配 640m → 1024m。
    # depends_on nest=healthy 保留为刻意错峰（非功能依赖）：避免 nest+构图双峰叠加。
    mem_limit: 1024m
    environment:
      ROUTE_PG_HOST: postgis
    volumes:
      - ./backend/data:/app/backend/data:ro
    ports:
      - '8000:8000'
    depends_on:
      postgis:
        condition: service_healthy
      nest:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)" || exit 1
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped

volumes:
  beibu-pgdata:
