# 北部湾港 WebGIS 智慧分析平台 —— 本地一键编排
# 用法：docker compose up --build
#   前端：  http://localhost:8080
#   后端 API：http://localhost:8080/api/...（经 nginx 反向代理）
#   后端直连：http://localhost:3000
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    # d064: 镜像版本 tag（回滚用）。部署时传 IMAGE_TAG=<上一版本tag> 即可切回旧版；
    # 不传则默认 latest。配合 scripts/rollback.sh 使用。
    image: beibu-gulf-webgis:${IMAGE_TAG:-latest}
    container_name: beibu-gulf-webgis
    # 运行时注入密钥与端口：env_file 在容器启动期读取本地 backend/.env，
    # 不会烘焙进镜像；environment 的 NODE_ENV=production 优先级高于 env_file。
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=production
    # 运行时数据通过 volume 挂载，不烘焙进镜像（backend/data 已在 .dockerignore 排除）
    volumes:
      - ./backend/data:/app/backend/data
      # DEM 静态产物（tif 67MB 被 gitignore、CI 镜像不含；本地含 → CI/本地镜像不一致）。
      # 统一 volume 挂载，镜像瘦身且 CI/本地行为一致；接入数据库/对象存储后替换此方案。
      - ./backend/static/dem:/app/backend/static/dem
      # TLS 证书（可选）：将 fullchain.pem + privkey.pem 放入 ./certs/ 即启用 HTTPS
      - ./certs:/etc/nginx/certs:ro
    ports:
      - "8080:80"      # nginx（前端 + API 代理）
      - "8443:443"    # nginx HTTPS（需 ./certs/ 下有证书）
      - "3000:3000"    # 后端直连（可选）
    restart: unless-stopped
