<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 980" font-family="'Segoe UI','Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <filter id="c1" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="c2" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="7"/></filter>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="920" height="980" fill="#FFFFFF"/>

  <!-- ===== Background ribbon: AE style #3 (cloud blob) ===== -->
  <path d="M460,70 C590,210 590,360 460,500 C330,640 330,790 460,960"
        fill="none" stroke="#FF5E3A" stroke-width="50" stroke-linecap="round" stroke-opacity="0.32" filter="url(#c1)"/>
  <path d="M460,70 C590,210 590,360 460,500 C330,640 330,790 460,960"
        fill="none" stroke="#FF7A45" stroke-width="22" stroke-linecap="round" stroke-opacity="0.50" filter="url(#c2)"/>
  <path d="M460,70 C590,210 590,360 460,500 C330,640 330,790 460,960"
        fill="none" stroke="#FF9A6A" stroke-width="8" stroke-linecap="round" stroke-opacity="0.60" filter="url(#c2)"/>

  <!-- Title -->
  <text x="460" y="50" text-anchor="middle" font-size="30" font-weight="700" fill="#0F172A">北部湾港 WebGIS 平台系统架构</text>

  <!-- ============ Layer 1: Application ============ -->
  <rect x="68" y="80" width="784" height="132" rx="8" fill="#F0F9FF" fill-opacity="0.5" stroke="#409EFF" stroke-width="2"/>
  <text x="92" y="108" font-size="15" font-weight="700" fill="#0EA5E9">Application Layer · 应用层</text>
  <g>
    <rect x="84" y="124" width="240" height="72" rx="8" fill="#FFFFFF" stroke="#409EFF" stroke-width="1.5"/>
    <text x="204" y="154" text-anchor="middle" font-size="15" font-weight="700" fill="#0EA5E9">Router</text>
    <text x="204" y="174" text-anchor="middle" font-size="12" fill="#64748B">路由分发</text>
    <rect x="340" y="124" width="240" height="72" rx="8" fill="#FFFFFF" stroke="#409EFF" stroke-width="1.5"/>
    <text x="460" y="154" text-anchor="middle" font-size="15" font-weight="700" fill="#0EA5E9">Views</text>
    <text x="460" y="174" text-anchor="middle" font-size="12" fill="#64748B">视图容器</text>
    <rect x="596" y="124" width="240" height="72" rx="8" fill="#FFFFFF" stroke="#409EFF" stroke-width="1.5"/>
    <text x="716" y="154" text-anchor="middle" font-size="15" font-weight="700" fill="#0EA5E9">页面组件</text>
    <text x="716" y="174" text-anchor="middle" font-size="12" fill="#64748B">Page Components</text>
  </g>

  <!-- ============ Layer 2: Business ============ -->
  <rect x="68" y="260" width="784" height="132" rx="8" fill="#F0F9FF" fill-opacity="0.5" stroke="#409EFF" stroke-width="2"/>
  <text x="92" y="288" font-size="15" font-weight="700" fill="#0EA5E9">Business Layer · 业务层</text>
  <g>
    <rect x="84" y="304" width="240" height="72" rx="8" fill="#FFFFFF" stroke="#409EFF" stroke-width="1.5"/>
    <text x="204" y="334" text-anchor="middle" font-size="15" font-weight="700" fill="#0EA5E9">Site Selection</text>
    <text x="204" y="354" text-anchor="middle" font-size="12" fill="#64748B">选址分析</text>
    <rect x="340" y="304" width="240" height="72" rx="8" fill="#FFFFFF" stroke="#409EFF" stroke-width="1.5"/>
    <text x="460" y="334" text-anchor="middle" font-size="15" font-weight="700" fill="#0EA5E9">Forecast</text>
    <text x="460" y="354" text-anchor="middle" font-size="12" fill="#64748B">趋势预测可视化</text>
    <rect x="596" y="304" width="240" height="72" rx="8" fill="#FFFFFF" stroke="#409EFF" stroke-width="1.5"/>
    <text x="716" y="334" text-anchor="middle" font-size="15" font-weight="700" fill="#0EA5E9">Flood Analysis</text>
    <text x="716" y="354" text-anchor="middle" font-size="12" fill="#64748B">洪涝分析</text>
  </g>

  <!-- ============ Layer 3: GIS Core ============ -->
  <rect x="68" y="440" width="784" height="308" rx="8" fill="#F0F9FF" fill-opacity="0.5" stroke="#409EFF" stroke-width="2"/>
  <text x="92" y="468" font-size="15" font-weight="700" fill="#0EA5E9">GIS Core Layer · 核心层</text>

  <rect x="340" y="484" width="240" height="72" rx="8" fill="#FFFFFF" stroke="#409EFF" stroke-width="1.5"/>
  <text x="460" y="526" text-anchor="middle" font-size="15" font-weight="700" fill="#0EA5E9">MapRenderer Interface</text>

  <rect x="212" y="572" width="240" height="72" rx="8" fill="#FFFFFF" stroke="#409EFF" stroke-width="1.5"/>
  <text x="332" y="602" text-anchor="middle" font-size="15" font-weight="700" fill="#0EA5E9">OpenLayers Renderer</text>
  <text x="332" y="622" text-anchor="middle" font-size="12" fill="#64748B">2D 实现</text>
  <rect x="468" y="572" width="240" height="72" rx="8" fill="#FFFFFF" stroke="#409EFF" stroke-width="1.5"/>
  <text x="588" y="602" text-anchor="middle" font-size="15" font-weight="700" fill="#0EA5E9">Cesium Renderer</text>
  <text x="588" y="622" text-anchor="middle" font-size="12" fill="#64748B">3D 实现</text>

  <rect x="84" y="660" width="240" height="72" rx="8" fill="#FFFFFF" stroke="#409EFF" stroke-width="1.5"/>
  <text x="204" y="690" text-anchor="middle" font-size="14" font-weight="700" fill="#0EA5E9">Layer Manager</text>
  <text x="204" y="710" text-anchor="middle" font-size="11" fill="#64748B">图层管理</text>
  <rect x="340" y="660" width="240" height="72" rx="8" fill="#FFFFFF" stroke="#409EFF" stroke-width="1.5"/>
  <text x="460" y="690" text-anchor="middle" font-size="14" font-weight="700" fill="#0EA5E9">Layer Adapter</text>
  <text x="460" y="710" text-anchor="middle" font-size="11" fill="#64748B">适配隔离</text>
  <rect x="596" y="660" width="240" height="72" rx="8" fill="#FFFFFF" stroke="#409EFF" stroke-width="1.5"/>
  <text x="716" y="690" text-anchor="middle" font-size="14" font-weight="700" fill="#0EA5E9">Spatial Utilities</text>
  <text x="716" y="710" text-anchor="middle" font-size="11" fill="#64748B">空间工具</text>

  <!-- ============ Layer 4: Backend ============ -->
  <rect x="68" y="796" width="784" height="132" rx="8" fill="#F0F9FF" fill-opacity="0.5" stroke="#409EFF" stroke-width="2"/>
  <text x="92" y="824" font-size="15" font-weight="700" fill="#0EA5E9">Backend / Data Service · 后端与数据服务</text>
  <g>
    <rect x="84" y="840" width="240" height="72" rx="8" fill="#FFFFFF" stroke="#409EFF" stroke-width="1.5"/>
    <text x="204" y="870" text-anchor="middle" font-size="15" font-weight="700" fill="#0EA5E9">Express API</text>
    <text x="204" y="890" text-anchor="middle" font-size="12" fill="#64748B">接口服务</text>
    <rect x="340" y="840" width="240" height="72" rx="8" fill="#FFFFFF" stroke="#409EFF" stroke-width="1.5"/>
    <text x="460" y="870" text-anchor="middle" font-size="15" font-weight="700" fill="#0EA5E9">Turf.js Spatial Analysis</text>
    <text x="460" y="890" text-anchor="middle" font-size="12" fill="#64748B">空间计算</text>
    <rect x="596" y="840" width="240" height="72" rx="8" fill="#FFFFFF" stroke="#409EFF" stroke-width="1.5"/>
    <text x="716" y="870" text-anchor="middle" font-size="15" font-weight="700" fill="#0EA5E9">GeoJSON Data</text>
    <text x="716" y="890" text-anchor="middle" font-size="12" fill="#64748B">数据资产</text>
  </g>
</svg>
