<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 预连接天地图瓦片服务，消除首张瓦片的 DNS+TLS+RTT 延迟 -->
    <link rel="preconnect" href="https://t0.tianditu.gov.cn" crossorigin />
    <link rel="preconnect" href="https://t1.tianditu.gov.cn" crossorigin />
    <link rel="preconnect" href="https://t2.tianditu.gov.cn" crossorigin />
    <title>北部湾城市群选址分析平台</title>
    <!-- FOUC 防闪白：首帧即按本地主题渲染，避免暗色用户刷新时先白后暗；key 与 useTheme.ts:21 gcs-theme 同源 -->
    <script>
      try {
        var t = localStorage.getItem('gcs-theme')
        if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.setAttribute('data-theme', t)
        if (t === 'dark') document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app">
      <div class="loading-wrap">
        <div class="loading-spinner"></div>
        <div class="loading-text">加载中，请稍后...</div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
