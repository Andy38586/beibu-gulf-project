<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>马道枢纽 · 单块 3D Tiles</title>
    <link rel="stylesheet" href="/cesium/Widgets/widgets.css" />
    <script src="/cesium/Cesium.js"></script>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b1420;
      }
      #c {
        position: absolute;
        inset: 0;
      }
      #t {
        position: absolute;
        left: 12px;
        top: 12px;
        color: #cfe6ff;
        font:
          13px/1.6 system-ui,
          'Microsoft YaHei';
        background: rgba(8, 18, 30, 0.8);
        padding: 8px 12px;
        border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <div id="c"></div>
    <div id="t">加载中…</div>
    <script>
      /* 只含马道枢纽一块瓦片（单块叶子）。天地图/底图全关，只留这一个枢纽。 */
      var out = document.getElementById('t')
      Cesium.Ion.defaultAccessToken = undefined
      var v = new Cesium.Viewer('c', {
        baseLayer: false,
        terrainProvider: undefined,
        animation: false,
        timeline: false,
        geocoder: false,
        homeButton: false,
        baseLayerPicker: false,
        navigationHelpButton: false,
        sceneModePicker: false,
        fullscreenButton: false,
        selectionIndicator: false,
        infoBox: false,
        skyBox: false,
        skyAtmosphere: false,
        contextOptions: { webgl: { alpha: false } },
      })
      v.scene.globe.show = false
      Cesium.Cesium3DTileset.fromUrl('/madao-hub.json', { maximumScreenSpaceError: 8 })
        .then(function (ts) {
          v.scene.primitives.add(ts)
          ts.show = true
          v.camera.lookAt(Cesium.Cartesian3.fromDegrees(108.94161, 22.44779, 73.5), {
            heading: Cesium.Math.toRadians(211),
            pitch: Cesium.Math.toRadians(-32),
            range: 2600,
          })
          window.__ts = ts
          setInterval(function () {
            v.scene.requestRender()
            var s = ts.statistics
            out.textContent =
              '马道枢纽（单块） ready=' +
              s.numberOfTilesWithContentReady +
              ' cmds=' +
              s.numberOfCommands +
              ' sel=' +
              ts._selectedTiles.length +
              ' ｜ 相机高 ' +
              Math.round(v.camera.positionCartographic.height) +
              ' m'
          }, 500)
        })
        .catch(function (e) {
          out.textContent = '加载失败: ' + e
        })
    </script>
  </body>
</html>
