<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>3D Tiles 冒烟测试（单一 Cesium 实例）</title>
    <link rel="stylesheet" href="/cesium/Widgets/widgets.css" />
    <script src="/cesium/Cesium.js"></script>
    <style>
      html, body { margin: 0; height: 100%; background: #0b1420; color: #cfe6ff;
                   font: 13px/1.6 system-ui, "Microsoft YaHei", sans-serif; }
      #c { position: absolute; inset: 0; }
      #out { position: absolute; left: 10px; top: 10px; z-index: 9; background: rgba(8, 18, 30, .85);
             padding: 10px 12px; border-radius: 8px; white-space: pre; max-width: 60vw; }
    </style>
  </head>
  <body>
    <div id="c"></div>
    <pre id="out">启动中…</pre>
    <script>
      /**
       * 3D Tiles 冒烟测试页（诊断 D-J 用）
       *
       * 与 app 主页面共享同一个源（dev server 5173）与同一份 /cesium/Cesium.js，
       * 但**不经过任何 app 模块**（无 Vue / 无 pinia / 无 HMR 图）。
       * 作用：把「页面/环境层」与「app 模块上下文层」切开——
       *   - 本页能选中瓦片 ⇒ 问题在 app 的模块上下文；
       *   - 本页也选不中   ⇒ 问题在源/环境层（同源 5173 或这份 Cesium 构建）。
       */
      const out = document.getElementById('out')
      const log = (s) => { out.textContent += '\n' + s }
      window.__probe = { steps: [] }
      const note = (k, v) => { window.__probe.steps.push(k + '=' + v); log(k + ' = ' + v) }

      try {
        note('window.Cesium', typeof window.Cesium + ' v' + (window.Cesium && window.Cesium.VERSION))
        note('CESIUM_BASE_URL', String(window.CESIUM_BASE_URL || '(未设置)'))

        const v = new Cesium.Viewer('c', {
          baseLayer: false, terrainProvider: undefined, animation: false, timeline: false,
          geocoder: false, homeButton: false, baseLayerPicker: false, navigationHelpButton: false,
          sceneModePicker: false, fullscreenButton: false, selectionIndicator: false, infoBox: false,
          contextOptions: { webgl: { alpha: false } }
        })
        v.scene.globe.show = false
        v.scene.skyAtmosphere.show = false

        // 单块瓦片：root 自带 content（马道枢纽 b3dm），content.uri 用绝对地址
        const b3dm = location.origin + '/static/pinglu/tiles-v2/tiles/' + encodeURIComponent('hub_马道枢纽.b3dm')
        const mini = {
          asset: { version: '1.0' },
          geometricError: 0,
          root: {
            boundingVolume: { region: [
              108.930 * Math.PI / 180, 22.435 * Math.PI / 180,
              108.950 * Math.PI / 180, 22.460 * Math.PI / 180, 0, 300
            ] },
            geometricError: 0, refine: 'ADD', content: { uri: b3dm }
          }
        }
        note('b3dm', b3dm)

        Cesium.Cesium3DTileset.fromUrl(
          'data:application/json;base64,' + btoa(JSON.stringify(mini)),
          { maximumScreenSpaceError: 16 }
        ).then(function (ts) {
          v.scene.primitives.add(ts)
          ts.tileFailed.addEventListener(function (e) { note('tileFailed', (e && e.message) || e) })
          v.camera.lookAt(
            Cesium.Cartesian3.fromDegrees(108.94161, 22.44779, 73.5),
            { heading: Cesium.Math.toRadians(211), pitch: Cesium.Math.toRadians(-32), range: 8000 }
          )
          const t0 = Date.now()
          const tick = setInterval(function () {
            v.scene.requestRender()
            const st = ts.statistics
            const line = 'ready=' + st.numberOfTilesWithContentReady + ' cmds=' + st.numberOfCommands +
              ' attempted=' + st.numberOfAttemptedRequests + ' failed=' + st.numberOfFailedRequests +
              ' sel=' + ts._selectedTiles.length + ' rootVis=' + (ts._root && ts._root._visitedFrameNumber)
            window.__probe.last = line
            out.textContent = '【3D Tiles 冒烟】\n' + window.__probe.steps.join('\n') + '\n' + line
            if (Date.now() - t0 > 25000) clearInterval(tick)
          }, 500)
        }).catch(function (e) { note('fromUrl 失败', String(e).slice(0, 120)) })

        // B 组对照：直接加载真实文件 URL 的完整 tileset（管线 viewer 走的就是这条路）
        Cesium.Cesium3DTileset.fromUrl('/static/pinglu/tiles-v2/tileset.json',
          { maximumScreenSpaceError: 8 }).then(function (ts2) {
            v.scene.primitives.add(ts2)
            note('B组 直接URL', '已添加')
            const t1 = Date.now()
            const tick2 = setInterval(function () {
              v.scene.requestRender()
              const st = ts2.statistics
              window.__probe.lastB = 'B: ready=' + st.numberOfTilesWithContentReady + ' cmds=' +
                st.numberOfCommands + ' attempted=' + st.numberOfAttemptedRequests +
                ' total=' + st.numberOfTilesTotal + ' sel=' + ts2._selectedTiles.length
              if (Date.now() - t1 > 20000) clearInterval(tick2)
            }, 500)
          }).catch(function (e) { note('B组 fromUrl 失败', String(e).slice(0, 120)) })
      } catch (e) {
        note('异常', String(e).slice(0, 160))
      }
    </script>
  </body>
</html>
