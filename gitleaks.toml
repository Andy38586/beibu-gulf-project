# gitleaks 配置（2026-08-09 加入）
# 背景：CI secret-scan 误报两类内容，用 allowlist 放行——
# 1. 测试 fixture 的假 token（logSanitizer 用例，generic-api-key 规则误报）
# 2. 历史泄露 key 的文档记录（d056 条目，完整值已打码为 e4cef34…）
# 注意：历史 commit 中的旧 key（src/composables/useBaseLayers.js 等已删文件）不在此放行，
# 由 tools/git-clean-history.sh 一次性处理（守 git 红线，不重写历史）。
title = "beibu-gulf gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "测试假 token 与历史泄露 key 的文档记录（均已打码/非真实凭据）"
paths = [
  "backend/middleware/__tests__/logSanitizer.test.js",
  "docs/已解决问题.md",
  "docs/待解决问题.md",
  "docs/已解决问题-精选版.md",
]
