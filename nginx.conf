# HTTP → HTTPS 重定向（当 TLS 证书就位后启用）
server {
    listen 80;
    server_name localhost;

    # 若挂载了 TLS 证书（/etc/nginx/certs/），强制跳转 HTTPS
    # 否则保留 HTTP 服务（开发/演示环境）
    set $use_https 0;
    if (-f /etc/nginx/certs/fullchain.pem) {
        set $use_https 1;
    }

    # ACME challenge 保留（Let's Encrypt 续期用）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        # 有证书时跳转 HTTPS，无证书时直接服务前端
        if ($use_https = 1) {
            return 301 https://$host$request_uri;
        }
        root /app/frontend/dist;
        try_files $uri $uri/ /index.html;
    }

    # API 代理到后端（express，端口 3000）
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 带 hash 的构建产物（JS/CSS），内容变化 → 文件名变化，可永久缓存
    location /assets/ {
        root /app/frontend/dist;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 静态数据文件（mock JSON 等，与前端 public/data 同源）
    location /data/ {
        root /app/frontend/dist;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Cesium 资源（Workers/Assets 带版本 hash）
    location /cesium/ {
        root /app/frontend/dist;
        expires 30d;
        add_header Cache-Control "public";
    }

    # z022: 天地图瓦片同源代理（消除外部依赖不可控 + 浏览器跨域 preflight）
    location /tianditu/ {
        proxy_pass https://t0.tianditu.gov.cn/;
        proxy_http_version 1.1;
        proxy_set_header Host t0.tianditu.gov.cn;
        proxy_set_header X-Real-IP "";
        proxy_ssl_server_name on;
        expires 30d;
        add_header Cache-Control "public";
    }

    # Gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;
}

# HTTPS 服务器配置（条件加载）
# docker-entrypoint.sh 会在检测到 /etc/nginx/certs/fullchain.pem 时
# 自动生成 /etc/nginx/http.d/https.conf，否则不生成（通配符 include 无文件时不报错）
include /etc/nginx/http.d/https*.conf;
