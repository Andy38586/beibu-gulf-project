# HTTP → HTTPS 重定向（当 TLS 证书就位后启用）
# 2026-09-10（阶段 4）：algorithm-service（FastAPI）退役，/flood-online 反代与
# d102 限流 zone（flood:10m）一并移除——淹没/路径能力已由 Nest+PostGIS 覆盖

server {
    listen 80;
    server_name localhost;

    # 若挂载了 TLS 证书（/etc/nginx/certs/），强制跳转 HTTPS
    # 否则保留 HTTP 服务（开发/演示环境）
    set $use_https 0;
    if (-f /etc/nginx/certs/fullchain.pem) {
        set $use_https 1;
    }

    # ACME challenge 保留（Let's Encrypt 续期用）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        # 有证书时跳转 HTTPS，无证书时直接服务前端
        if ($use_https = 1) {
            return 301 https://$host$request_uri;
        }
        root /app/frontend/dist;
        try_files $uri $uri/ /index.html;
    }

    # 副-08：CSP 以 Report-Only 起步（不阻断功能），收集浏览器违规报告后逐步收紧。
    # 当前为过渡宽松值：地图库（OL/Cesium）与 Vite 产物需要 inline script/style；
    # 天地图经 /tianditu/ 同源代理，connect-src 'self' 已覆盖。收紧方向：
    # 去掉 unsafe-eval → script-src 白名单 → 全程无 inline。report-uri 待接入上报端点。
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; media-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'";

    # ⚠️⚠️ CSP 继承陷阱（2026-09-11 实测确认，与 docker-entrypoint.sh 的 https.conf 同源问题）：
    # nginx 的 add_header 是**层级全量替换**——子级只要出现任意一条 add_header，父级（本
    # server 块）的所有 add_header **全部不再继承**，不是合并。
    # 因此下面每个自带 add_header 的 location 都必须把上面的 CSP 重复一遍；不加则这些路径
    # 上「已加 CSP」这句话不成立。线上实测证据：GET /assets/js/index-*.js（首屏必加载）
    # 返回 200 但 4 个安全头全丢。
    # （本 :80 server 块只在无 TLS 证书的 dev/演示环境生效；生产流量走 docker-entrypoint.sh
    #   生成的 443/8443，那里的同名问题已在同一提交修复。）

    # API 代理到 v3 业务层（Nest，服务名 nest，端口 3000；Express 已退役）
    # 前缀 nest-api 为 Nest 全局前缀，前端 VITE_USE_NEST_MODULES 全切后命中此处
    # 注：本 location 无自带 add_header → 正常继承 server 级 CSP，无需重复
    location /nest-api/ {
        proxy_pass http://nest:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # 兼容旧 /api 前缀（历史构建产物/外部调用方），指向 nest 同一服务
    location /api/ {
        rewrite ^/api(/.*)$ /nest-api$1 break;
        proxy_pass http://nest:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # 2026-09-10（阶段 4）：原 location /flood-online/（反代 algorithm-service:8000）
    # 已随 FastAPI 退役删除；route/淹没请求走上方 /nest-api 反代

    # 带 hash 的构建产物（JS/CSS），内容变化 → 文件名变化，可永久缓存
    location /assets/ {
        root /app/frontend/dist;
        # 2026-09-11 修复重复 Cache-Control：nginx `expires` 自身即生成
        # `Cache-Control: max-age=<t>`，与手写 add_header 并存会下发两条（手写那条被遮蔽、
        # immutable 从未生效）。修法：二者只留其一——此处需 immutable，故删 expires 改手写真值。
        add_header Cache-Control "public, max-age=31536000, immutable";
        # 安全头重复（add_header 层级替换语义，详见上方 CSP 陷阱说明）
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; media-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'";
    }

    # 静态数据文件（mock JSON 等，与前端 public/data 同源）
    location /data/ {
        root /app/frontend/dist;
        # 2026-09-11：删手写 Cache-Control（expires 已生成 max-age，避免重复头）
        expires 7d;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; media-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'";
    }

    # DEM 派生产物（hillshade COG / terrain 瓦片）——后端 static 托管
    # 镜像内路径 /app/backend/static/dem/*（Dockerfile COPY backend/ 带入，.dockerignore 未排除）
    # dev 由 vite 代理 /static；生产必须 nginx 直接服务（此前缺失 → DEM 真实地形 404）
    # 2026-08-09：/static/terrain/ 需在 /static/ 之前（最长前缀优先），并补 Content-Encoding gzip——
    # .terrain 瓦片本身是 gzip 压缩流（CTB 输出，后端 Express 也这样响应），
    # 缺该头 Cesium 按原始字节解析 → RangeError: Invalid typed array length: 4225。
    location /static/terrain/ {
        alias /app/backend/static/terrain/;
        # 2026-09-11：删手写 Cache-Control（同 /data/，避免重复头）
        expires 30d;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; media-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'";
        # 2026-08-10 修复：Content-Encoding gzip 只对 .terrain 瓦片（本身是 gzip 压缩流）
        # 生效——原无条件 add_header 导致 layer.json（普通 JSON）被声明 gzip 但内容未压缩
        # （请求不带 Accept-Encoding 时 nginx 不压）→ 浏览器 ERR_CONTENT_DECODING_FAILED
        # → CesiumTerrainProvider 加载失败 → 真地形整体失效（本地 express 只对 .terrain 加头）
        # 2026-09-11 补：嵌套 location 同样有层级替换问题，CSP 需再重复一层
        location ~ \.terrain$ {
            # 2026-09-11：本嵌套 location 无 expires，但父级 expires 30d **会正常继承**
            # （expires 是独立指令，不受 add_header 层级替换影响）——实测确认父级
            # `Cache-Control: max-age=2592000` 会与本处手写的 `public` 并存 → 又是重复头。
            # 故此处删掉手写 Cache-Control，只保留必须的 Content-Encoding 与 CSP。
            add_header Content-Encoding gzip;
            add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; media-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'";
        }
    }
    location /static/ {
        alias /app/backend/static/;
        # 2026-09-11：删手写 Cache-Control（同 /data/，避免重复头）
        expires 30d;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; media-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'";
    }

    # Cesium 资源（Workers/Assets 带版本 hash）
    location /cesium/ {
        root /app/frontend/dist;
        # 2026-09-11：删手写 Cache-Control（同 /data/，避免重复头）
        expires 30d;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; media-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'";
    }

    # z022: 天地图瓦片同源代理（消除外部依赖不可控 + 浏览器跨域 preflight）
    location /tianditu/ {
        proxy_pass https://t0.tianditu.gov.cn/;
        proxy_http_version 1.1;
        proxy_set_header Host t0.tianditu.gov.cn;
        proxy_set_header X-Real-IP "";
        proxy_ssl_server_name on;
        # 2026-09-11：删手写 Cache-Control（同 /data/，避免重复头）
        expires 30d;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; media-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'";
    }

    # Gzip 压缩（兼容旧浏览器回退）
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1000;

    # Brotli 压缩（副-07：现代浏览器优先，传输体积比 gzip 再降 ~15%；
    # 需 nginx-mod-http-brotli 模块（Dockerfile 安装），模块缺失时 nginx 启动即失败——构建期验证）
    brotli on;
    brotli_comp_level 6;
    brotli_min_length 1000;
    brotli_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
}

# HTTPS 服务器配置（条件加载）
# docker-entrypoint.sh 会在检测到 /etc/nginx/certs/fullchain.pem 时
# 自动生成 /etc/nginx/http.d/https.conf，否则不生成（通配符 include 无文件时不报错）
include /etc/nginx/http.d/https*.conf;
